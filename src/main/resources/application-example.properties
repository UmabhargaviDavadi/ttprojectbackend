spring.application.name=smart-finance-tracker-api
server.port=8080
server.servlet.context-path=/api
spring.datasource.url=jdbc:mysql://localhost:3306/finance_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=finance_app
spring.datasource.password=finance_app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.jwt.secret=replace-with-a-random-secret-at-least-32-characters
app.jwt.expiration-ms=86400000
app.seed-demo=true
