spring.application.name=smart-finance-tracker-api

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finance_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:finance_app}
spring.datasource.password=${DB_PASSWORD:finance_app}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Authentication Configuration
app.jwt.secret=${JWT_SECRET:local-development-secret-key-change-this-32chars-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Demo Data Configuration
app.seed-demo=${SEED_DEMO:true}

# Swagger / OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
